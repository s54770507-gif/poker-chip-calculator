<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="theme-color" content="#0a0a0a">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <title>德州撲克籌碼計算器</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="app" class="phase-home">

  <!-- ════════════ 首頁 ════════════ -->
  <div id="screen-home">
    <div class="home-logo">
      <div class="suit-row">♠ ♥ ♣ ♦</div>
      <h1>德州撲克籌碼計算器</h1>
      <p>支援 2–10 人 · 跨裝置即時同步</p>
    </div>
    <div class="home-actions">
      <button id="btn-create" class="btn btn-primary">建立新房間</button>
      <div class="join-row">
        <input type="text" id="room-code-input" maxlength="6" placeholder="輸入代碼" autocomplete="off" autocapitalize="characters">
        <button id="btn-join" class="btn btn-secondary">加入</button>
      </div>
    </div>
  </div>

  <!-- ════════════ 設定 ════════════ -->
  <div id="screen-setup">
    <div class="screen-header">
      <h1>遊戲設定</h1>
    </div>
    <div class="scroll-area">
      <div>
        <div class="section-label">玩家人數</div>
        <div class="count-btns">
          <button class="count-btn" data-count="2">2</button>
          <button class="count-btn" data-count="3">3</button>
          <button class="count-btn active" data-count="4">4</button>
          <button class="count-btn" data-count="5">5</button>
          <button class="count-btn" data-count="6">6</button>
          <button class="count-btn" data-count="7">7</button>
          <button class="count-btn" data-count="8">8</button>
          <button class="count-btn" data-count="9">9</button>
          <button class="count-btn" data-count="10">10</button>
        </div>
      </div>
      <div>
        <div class="section-label">玩家名稱</div>
        <div id="player-names"></div>
      </div>
      <div>
        <div class="section-label">起始籌碼</div>
        <input type="number" id="starting-chips" value="5000" min="100" step="100">
      </div>
      <div>
        <div class="section-label">盲注設定</div>
        <div class="blind-row">
          <div>
            <div class="section-label">小盲</div>
            <input type="number" id="small-blind" value="25" min="1">
          </div>
          <div>
            <div class="section-label">大盲</div>
            <input type="number" id="big-blind" value="50" min="2">
          </div>
        </div>
      </div>
    </div>
    <div class="setup-footer">
      <button id="btn-create-room" class="btn btn-gold">建立房間</button>
      <button id="btn-back-setup" class="btn btn-secondary">返回</button>
    </div>
  </div>

  <!-- ════════════ 等待室 ════════════ -->
  <div id="screen-waiting">
    <div class="screen-header">
      <h1>等待玩家加入</h1>
    </div>
    <div class="scroll-area">
      <div class="room-code-box">
        <p>房間代碼</p>
        <div id="room-code-display">------</div>
        <div id="waiting-count">0 / 0 玩家已加入</div>
      </div>
      <ul id="waiting-players"></ul>
    </div>
    <div class="waiting-footer">
      <button id="btn-start-game" class="btn btn-gold" style="display:none">開始遊戲</button>
      <button id="btn-leave-room" class="btn btn-secondary">離開房間</button>
    </div>
  </div>

  <!-- ════════════ 遊戲畫面 ════════════ -->
  <div id="screen-hand">
    <div id="hand-header">
      <span id="hand-number">第 1 局</span>
      <div id="pot-display">底池 <span class="pot-val" id="pot-amount">0</span></div>
      <span id="round-name">翻牌前</span>
    </div>

    <div id="player-list"></div>

    <div id="action-area">
      <div id="actor-label" class="actor-label">
        <div id="actor-name"></div>
      </div>

      <div id="waiting-msg">等待中...</div>

      <div id="action-buttons" style="display:none">
        <button class="action-btn" id="btn-fold">棄牌</button>
        <button class="action-btn" id="btn-check" style="display:none">過牌</button>
        <button class="action-btn" id="btn-call"  style="display:none">跟注</button>
        <button class="action-btn" id="btn-raise-toggle">加注 ▾</button>
      </div>

      <div id="raise-panel" class="hidden">
        <div id="raise-presets">
          <button class="raise-preset" id="raise-p33"  data-amount="0">
            <span>1/3 底池</span><small>–</small>
          </button>
          <button class="raise-preset" id="raise-p50"  data-amount="0">
            <span>1/2 底池</span><small>–</small>
          </button>
          <button class="raise-preset" id="raise-p100" data-amount="0">
            <span>底池</span><small>–</small>
          </button>
          <button class="raise-preset" id="raise-allin" data-amount="0">
            <span>全下</span><small>–</small>
          </button>
        </div>
        <div class="custom-raise-row">
          <input type="number" id="raise-custom-input" placeholder="自訂金額" min="1">
          <button id="btn-raise-confirm" class="btn btn-primary">確認</button>
          <button id="btn-raise-cancel" class="btn btn-secondary">取消</button>
        </div>
      </div>

      <button id="btn-show-history-hand" class="btn btn-secondary btn-history" style="display:none;margin-top:auto">查看歷史紀錄</button>
    </div>
  </div>

  <!-- ════════════ 攤牌 ════════════ -->
  <div id="screen-showdown">
    <div class="screen-header">
      <h1>攤牌結算</h1>
      <p>點選每個底池的贏家</p>
    </div>
    <div class="scroll-area">
      <div id="showdown-pots"></div>
      <div class="showdown-chips">
        <h3>目前籌碼</h3>
        <div id="showdown-chips"></div>
      </div>
    </div>
    <div class="showdown-footer">
      <button id="btn-new-hand" class="btn btn-gold">開始下一局</button>
      <button id="btn-show-history-showdown" class="btn btn-secondary btn-history">查看歷史紀錄</button>
    </div>
  </div>

  <!-- ════════════ 歷史 ════════════ -->
  <div id="screen-history">
    <div class="screen-header">
      <h1>多局紀錄</h1>
    </div>
    <div class="scroll-area">
      <table id="history-table">
        <thead>
          <tr>
            <th>局數</th>
            <th>贏家</th>
            <th>底池</th>
          </tr>
        </thead>
        <tbody id="history-tbody"></tbody>
      </table>
    </div>
    <div class="history-footer">
      <button id="btn-back-game" class="btn btn-secondary">返回遊戲</button>
    </div>
  </div>

</div><!-- #app -->

<!-- 選擇玩家 overlay -->
<div id="player-select-overlay" class="overlay hidden">
  <div class="overlay-box">
    <h2>你是哪位玩家？</h2>
    <p>點選你的名字</p>
    <div id="player-select-list"></div>
    <button id="btn-cancel-join" class="btn btn-secondary" style="margin-top:12px">取消</button>
  </div>
</div>

<div id="toast"></div>

<script type="module" src="js/app.js"></script>
</body>
</html>
